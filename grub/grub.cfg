# aa 当前只提供一个 Multiboot2 启动项，不显示选择菜单，也不等待输入。
set default=0
set timeout=0

# GRUB 的诊断输出通过 COM1 发送到 QEMU 的标准输入输出终端。
# 后续 aa 自己初始化 COM1 后，也会继续使用相同的 115200 8N1 配置。
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

menuentry "aa" {
    # 路径对应 ISO 制作阶段复制进去的 /boot/aa。
    # multiboot2 会验证 header、按 ELF LOAD 段装载内核，并跳到 e_entry。
    multiboot2 /boot/aa
    boot
}
